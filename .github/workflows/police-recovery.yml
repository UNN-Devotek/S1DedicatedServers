name: Dedicated NPC regression checks

on:
  push:
    paths:
      - 'Server/Game/Patches/Gameplay/NpcBehaviourPatches.cs'
      - 'Server/Game/Patches/Gameplay/PolicePursuitPatches.cs'
      - 'Server/Game/Patches/Gameplay/NpcRagdollRecoveryPatches.cs'
      - 'tests/PoliceRecoveryTests/**'
      - 'Shared/Patches/ReportingLogCollectorPatches.cs'
      - 'Utils/DedicatedRuntimeContext.cs'
      - 'Utils/SafeReflection.cs'
      - 'DedicatedServerMod.csproj'
      - 'tests/ReportingCollectorTests/**'
      - 'Client/Patches/ClientRuntimeStabilityPatches.cs'
      - 'Client/Patches/NpcBuildingEntryPatches.cs'
      - 'tests/NpcBuildingEntryTests/**'
      - 'Shared/Patches/ActionListStabilityPatches.cs'
      - 'Shared/Patches/SceneCallbackPatches.cs'
      - 'Utils/SceneCallbackLifetime.cs'
      - 'tests/SceneCallbackTests/**'
      - '.github/workflows/police-recovery.yml'
  pull_request:
    paths:
      - 'Server/Game/Patches/Gameplay/NpcBehaviourPatches.cs'
      - 'Server/Game/Patches/Gameplay/PolicePursuitPatches.cs'
      - 'Server/Game/Patches/Gameplay/NpcRagdollRecoveryPatches.cs'
      - 'tests/PoliceRecoveryTests/**'
      - 'Shared/Patches/ReportingLogCollectorPatches.cs'
      - 'Utils/DedicatedRuntimeContext.cs'
      - 'Utils/SafeReflection.cs'
      - 'DedicatedServerMod.csproj'
      - 'tests/ReportingCollectorTests/**'
      - 'Client/Patches/ClientRuntimeStabilityPatches.cs'
      - 'Client/Patches/NpcBuildingEntryPatches.cs'
      - 'tests/NpcBuildingEntryTests/**'
      - 'Shared/Patches/ActionListStabilityPatches.cs'
      - 'Shared/Patches/SceneCallbackPatches.cs'
      - 'Utils/SceneCallbackLifetime.cs'
      - 'tests/SceneCallbackTests/**'
      - '.github/workflows/police-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise police recovery patches
        run: dotnet run --project tests/PoliceRecoveryTests -p:RuntimeDefine=${{ matrix.runtime }}

  reporting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
        side: [SERVER, CLIENT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise current-game feedback collector guard
        run: dotnet run --project tests/ReportingCollectorTests -p:RuntimeDefine=${{ matrix.runtime }} -p:SideDefine=${{ matrix.side }}

  building-entry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise NPC building-entry guard registration and validation
        run: dotnet run --project tests/NpcBuildingEntryTests -p:RuntimeDefine=${{ matrix.runtime }}

  scene-callbacks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise scene cleanup and callback unsubscription
        run: dotnet run --project tests/SceneCallbackTests -p:RuntimeDefine=${{ matrix.runtime }}
