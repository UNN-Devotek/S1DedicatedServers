name: Dedicated NPC regression checks

on:
  push:
    paths:
      - 'Server/Game/Patches/Gameplay/NpcBehaviourPatches.cs'
      - 'Server/Game/Patches/Gameplay/PolicePursuitPatches.cs'
      - 'Server/Game/Patches/Gameplay/NpcRagdollRecoveryPatches.cs'
      - 'tests/PoliceRecoveryTests/**'
      - 'Shared/Patches/ReportingLogCollectorPatches.cs'
      - 'Utils/DedicatedRuntimeContext.cs'
      - 'Utils/SafeReflection.cs'
      - 'DedicatedServerMod.csproj'
      - 'tests/ReportingCollectorTests/**'
      - 'Client/Patches/ClientRuntimeStabilityPatches.cs'
      - 'Client/Patches/NpcBuildingEntryPatches.cs'
      - 'tests/NpcBuildingEntryTests/**'
      - 'Shared/Patches/ActionListStabilityPatches.cs'
      - 'Shared/Patches/SceneCallbackPatches.cs'
      - 'Utils/SceneCallbackLifetime.cs'
      - 'tests/SceneCallbackTests/**'
      - 'Client/Patches/BetaAuthorityPatches.cs'
      - 'Client/Patches/LoopbackVisibilityPatches.cs'
      - 'Client/Patches/LoadingScreenPatches.cs'
      - 'Shared/Patches/BetaQuestGuidPatches.cs'
      - 'tests/BetaRuntimeTests/**'
      - 'Server/Game/Patches/Visual/HeadlessGpuPatches.cs'
      - 'Server/Game/Patches/Visual/ClientVisualPatches.cs'
      - 'tests/HeadlessVisualTests/**'
      - 'Client/Patches/CustomerMapPatches.cs'
      - 'Client/Patches/BetaTapPromptPatches.cs'
      - 'tests/ProgressionPresentationTests/**'
      - 'Server/Game/Patches/Gameplay/HeadlessTimeLoopPatches.cs'
      - 'Server/Game/Patches/Gameplay/TimeManagerPatches.cs'
      - 'Server/Game/Patches/UI/HeadlessSleepEventPatches.cs'
      - 'tests/HeadlessClockSleepTests/**'
      - '.github/workflows/police-recovery.yml'
  pull_request:
    paths:
      - 'Server/Game/Patches/Gameplay/NpcBehaviourPatches.cs'
      - 'Server/Game/Patches/Gameplay/PolicePursuitPatches.cs'
      - 'Server/Game/Patches/Gameplay/NpcRagdollRecoveryPatches.cs'
      - 'tests/PoliceRecoveryTests/**'
      - 'Shared/Patches/ReportingLogCollectorPatches.cs'
      - 'Utils/DedicatedRuntimeContext.cs'
      - 'Utils/SafeReflection.cs'
      - 'DedicatedServerMod.csproj'
      - 'tests/ReportingCollectorTests/**'
      - 'Client/Patches/ClientRuntimeStabilityPatches.cs'
      - 'Client/Patches/NpcBuildingEntryPatches.cs'
      - 'tests/NpcBuildingEntryTests/**'
      - 'Shared/Patches/ActionListStabilityPatches.cs'
      - 'Shared/Patches/SceneCallbackPatches.cs'
      - 'Utils/SceneCallbackLifetime.cs'
      - 'tests/SceneCallbackTests/**'
      - 'Client/Patches/BetaAuthorityPatches.cs'
      - 'Client/Patches/LoopbackVisibilityPatches.cs'
      - 'Client/Patches/LoadingScreenPatches.cs'
      - 'Shared/Patches/BetaQuestGuidPatches.cs'
      - 'tests/BetaRuntimeTests/**'
      - 'Server/Game/Patches/Visual/HeadlessGpuPatches.cs'
      - 'Server/Game/Patches/Visual/ClientVisualPatches.cs'
      - 'tests/HeadlessVisualTests/**'
      - 'Client/Patches/CustomerMapPatches.cs'
      - 'Client/Patches/BetaTapPromptPatches.cs'
      - 'tests/ProgressionPresentationTests/**'
      - 'Server/Game/Patches/Gameplay/HeadlessTimeLoopPatches.cs'
      - 'Server/Game/Patches/Gameplay/TimeManagerPatches.cs'
      - 'Server/Game/Patches/UI/HeadlessSleepEventPatches.cs'
      - 'tests/HeadlessClockSleepTests/**'
      - '.github/workflows/police-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise police recovery patches
        run: dotnet run --project tests/PoliceRecoveryTests -p:RuntimeDefine=${{ matrix.runtime }}

  reporting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
        side: [SERVER, CLIENT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise current-game feedback collector guard
        run: dotnet run --project tests/ReportingCollectorTests -p:RuntimeDefine=${{ matrix.runtime }} -p:SideDefine=${{ matrix.side }}

  building-entry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise NPC building-entry guard registration and validation
        run: dotnet run --project tests/NpcBuildingEntryTests -p:RuntimeDefine=${{ matrix.runtime }}

  scene-callbacks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise scene cleanup and callback unsubscription
        run: dotnet run --project tests/SceneCallbackTests -p:RuntimeDefine=${{ matrix.runtime }}

  beta-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
        branch: [GAME_BETA, GAME_PUBLIC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise beta authority, quest identity, loading and loopback visibility
        run: dotnet run --project tests/BetaRuntimeTests -p:RuntimeDefine=${{ matrix.runtime }} -p:BranchDefine=${{ matrix.branch }}

  headless-visuals:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise headless GPU initialization and cleanup
        run: dotnet run --project tests/HeadlessVisualTests -p:RuntimeDefine=${{ matrix.runtime }}

  progression-presentation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
        branch: [GAME_BETA, GAME_PUBLIC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise map reconciliation and beta tap prompt bindings
        run: dotnet run --project tests/ProgressionPresentationTests -p:RuntimeDefine=${{ matrix.runtime }} -p:BranchDefine=${{ matrix.branch }}

  headless-clock-sleep:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [MONO, IL2CPP]
        branch: [GAME_BETA, GAME_PUBLIC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Exercise clock yields, native growth callbacks and sleep presentation completion
        run: dotnet run --project tests/HeadlessClockSleepTests -p:RuntimeDefine=${{ matrix.runtime }} -p:BranchDefine=${{ matrix.branch }}
