name: Build public and beta mods

on:
  push:
    branches: [main, dev, 'fix/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      game_branch:
        type: string
        default: Both
      source_ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.branch }} ${{ matrix.runtime }} ${{ matrix.side }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(inputs.game_branch == 'Public' && '["Public"]' || inputs.game_branch == 'Beta' && '["Beta"]' || '["Public","Beta"]') }}
        runtime: ${{ fromJSON(vars.S1DS_BUILD_RUNTIMES || '["Il2cpp"]') }}
        side: [Client, Server]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check private reference configuration
        shell: pwsh
        env:
          REFERENCE_REPOSITORY: ${{ vars.S1DS_ASSEMBLIES_REPO }}
          HAS_REFERENCE_KEY: ${{ secrets.S1DS_ASSEMBLIES_SSH_KEY != '' }}
        run: |
          if (!$env:REFERENCE_REPOSITORY -or $env:HAS_REFERENCE_KEY -ne 'true') {
            throw 'Configure S1DS_ASSEMBLIES_REPO and the read-only S1DS_ASSEMBLIES_SSH_KEY. Fork PRs cannot access these references; maintainers must review and build them on a trusted branch.'
          }
      - name: Checkout matching private game references
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.S1DS_ASSEMBLIES_REPO }}
          ssh-key: ${{ secrets.S1DS_ASSEMBLIES_SSH_KEY }}
          ref: ${{ matrix.branch == 'Beta' && 'beta' || 'public' }}
          path: game-assemblies
          persist-credentials: false
      - name: Configure matching references
        shell: pwsh
        env:
          GAME_BRANCH: ${{ matrix.branch }}
          MOD_RUNTIME: ${{ matrix.runtime }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'game-assemblies'
          if ($env:MOD_RUNTIME -eq 'Mono') {
            $managed = Join-Path $root 'Managed'
            $loader = Join-Path $root 'MelonLoader/net35'
            $paths = "<$($env:GAME_BRANCH)MonoAssembliesPath>$managed</$($env:GAME_BRANCH)MonoAssembliesPath><$($env:GAME_BRANCH)MonoMelonLoaderPath>$loader</$($env:GAME_BRANCH)MonoMelonLoaderPath>"
          } else {
            $managed = Join-Path $root 'MelonLoader/Il2CppAssemblies'
            $loader = Join-Path $root 'MelonLoader/net6'
            $paths = "<$($env:GAME_BRANCH)Il2CppAssembliesPath>$managed</$($env:GAME_BRANCH)Il2CppAssembliesPath><$($env:GAME_BRANCH)Il2CppMelonLoaderPath>$loader</$($env:GAME_BRANCH)Il2CppMelonLoaderPath>"
          }
          if (!(Test-Path "$managed/Assembly-CSharp.dll") -or !(Test-Path "$loader/MelonLoader.dll")) {
            throw 'Matching game and MelonLoader references were not found. Beta never falls back to public references.'
          }
          "<Project><PropertyGroup><AutomateLocalDeployment>false</AutomateLocalDeployment>$paths</PropertyGroup></Project>" | Set-Content ci.build.props
      - name: Build matching branch and side
        run: dotnet build DedicatedServerMod.csproj -c ${{ matrix.runtime }}_${{ matrix.side }} -p:GameBranch=${{ matrix.branch }} -p:CustomAfterMicrosoftCommonTargets=.github/ci/il2cpp-publicizer.targets -v minimal
      - name: Stage only distributable mod DLLs
        shell: pwsh
        env:
          GAME_BRANCH: ${{ matrix.branch }}
          MOD_RUNTIME: ${{ matrix.runtime }}
          MOD_SIDE: ${{ matrix.side }}
        run: |
          $framework = if ($env:MOD_RUNTIME -eq 'Il2cpp') { 'net6.0' } else { 'netstandard2.1' }
          $relative = "bin/$env:GAME_BRANCH/$($env:MOD_RUNTIME)_$env:MOD_SIDE/$framework"
          New-Item -ItemType Directory -Path "artifact/$relative" -Force | Out-Null
          Copy-Item "$relative/DedicatedServerMod_$($env:MOD_RUNTIME)_$env:MOD_SIDE.dll" "artifact/$relative/"
      - uses: actions/upload-artifact@v4
        with:
          name: DedicatedServerMod-${{ matrix.branch }}-${{ matrix.runtime }}-${{ matrix.side }}
          path: artifact/
          if-no-files-found: error
