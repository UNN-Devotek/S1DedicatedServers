name: Publish tagged public or beta release

on:
  push:
    tags: ['public-v*', 'beta-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed main tag: public-vVERSION or beta-vVERSION'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      branch: ${{ steps.release.outputs.branch }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          tag=os.environ['RELEASE_TAG']
          found=re.fullmatch(r'(public|beta)-v(\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)',tag)
          if not found: raise SystemExit('Use public-vVERSION or beta-vVERSION.')
          version=re.search(r'ModVersion = "([^"]+)"',Path('API/Version.cs').read_text()).group(1)
          if found.group(2)!=version: raise SystemExit('Tag must match API/Version.cs.')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tag_commit=subprocess.check_output(['git','rev-parse',tag+'^{commit}'],text=True).strip()
          if commit!=tag_commit: raise SystemExit('Checkout does not match the requested tag.')
          subprocess.run(['git','merge-base','--is-ancestor',commit,'origin/main'],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'tag={tag}\nversion={version}\nchannel={found.group(1)}\nbranch={found.group(1).title()}\ncommit={commit}\n')
          PY
  build:
    needs: metadata
    uses: ./.github/workflows/build.yml
    with:
      game_branch: Both
      source_ref: ${{ needs.metadata.outputs.commit }}
    secrets: inherit
  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: DedicatedServerMod-*
          merge-multiple: true
          path: .
      - name: Package mod assets and installers
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
          RUNTIMES: ${{ vars.S1DS_BUILD_RUNTIMES || '["Il2cpp"]' }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          subprocess.run(['python3','build/Package-Release.py','--version',os.environ['VERSION'],'--channel','both','--output','artifacts/release','--runtimes',*json.loads(os.environ['RUNTIMES'])],check=True)
          PY
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          tag=os.environ['RELEASE_TAG']; channel=os.environ['CHANNEL']
          check=subprocess.run(['gh','release','view',tag],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          if check.returncode==0: raise SystemExit('Release already exists. Do not overwrite it; increment the fork version.')
          notes=Path('release-notes.md')
          notes.write_text(f'Schedule I {channel} fork build. Download **Unnamed-Schedule-I-Setup.zip** for online setup, **Unnamed-Schedule-I-Client.zip** for this channel with bundled mod files, or **Unnamed-Schedule-I-Public-and-Beta.zip** for the shareable installer with both channels bundled. All ZIPs support Windows and Linux/Steam Deck. The default automatic updater detects the installed source, channel, runtime and client/server side, then downloads the newest matching release. Explicit switches include original ifBars public releases; bundled/offline files are used only when selected explicitly. Switch the game branch in Steam first. Both players and server need matching builds. See the bundled START-HERE.md.\n')
          args=['gh','release','create',tag,'--verify-tag','--draft','--title',f'S1DS {channel.title()} {tag.split("-v",1)[1]}','--notes-file',str(notes)]
          if channel=='beta': args.append('--prerelease')
          subprocess.run(args,check=True)
          folder=Path('artifacts/release')/channel
          subprocess.run(['gh','release','upload',tag,*[str(p) for p in sorted(folder.iterdir()) if p.is_file()]],check=True)
          subprocess.run(['gh','release','edit',tag,'--draft=false','--latest='+str(channel=='public').lower()],check=True)
          PY
